.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type="file"] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type="file"]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.viz-carousel-controls :is(button, summary):focus-visible {
  outline: 2px solid var(--ring) !important;
  outline-offset: 2px !important;
}

@media (pointer: coarse) {
  .viz-carousel:has(> .viz-carousel-controls) {
    min-height: calc(76px + var(--viz-carousel-picker-height, 0px));
    padding-bottom: 76px;
  }

  .btn,
  .nav-link,
  .viz-carousel-controls button,
  .viz-carousel-picker > summary,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type="color"] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="time"],
    [type="week"]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: "";
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html>body{padding:0}</style>

<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__</script>
<script>(() => {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia("(prefers-color-scheme: dark)");
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    "codex-visualization-widget-state",
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? "{}");
  initialStateElement?.remove();
  /** @type {Record<string, unknown> | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? "none";
  let nextStateRequestId = 0;
  /** @type {Map<number, { resolve: () => void; reject: (error: Error) => void; timeout: ReturnType<typeof globalThis.setTimeout>; serializedState: string }>} */
  const pendingStateWrites = new Map();
  const persistenceError = () =>
    Object.assign(
      new Error("The host could not persist the widget state update"),
      {
        code: -32000,
        data: { code: "widget_state_persistence_failed", retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) => {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, "data");
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, "ports");
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, "source");
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) => {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) => {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("open-external", { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) => {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost("follow-up", { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record<string, unknown> | ((previous: Record<string, unknown> | null) => Record<string, unknown>)} next
   * @returns {Promise<void>}
   */
  const setWidgetState = async (next) => {
    const nextState = typeof next === "function" ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== "object" ||
      isArray(nextState)
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) => {
        if (
          typeof value === "undefined" ||
          typeof value === "function" ||
          typeof value === "symbol" ||
          (typeof value === "number" && !Number.isFinite(value))
        ) {
          throw new TypeError("Widget state must be a JSON object");
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== "object" ||
      isArray(parsedState)
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    if (
      hasOwn(storedState, "imageIds") &&
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) => typeof id !== "string",
        ))
    ) {
      throw new TypeError("Widget state imageIds must be an array of strings");
    }
    if (storedState.imageIds?.length > 0) {
      throw Object.assign(
        new TypeError("Visualization state does not support image attachments"),
        { code: -32602, data: { code: "images_unsupported" } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === "none") {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) => {
      const timeout = globalThis.setTimeout(() => {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost("widget-state-write", { id, state: serializedState });
    });
  };
  const syncTheme = () => {
    const theme = mediaQuery.matches ? "dark" : "light";
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: "none",
    };
    globalThis.dispatchEvent(
      new CustomEvent("openai:set_globals", {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () => {
    postToHost("height", {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    "message",
    (event) => {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== "object" ||
        data?.type !== "codex-visualization-initialize" ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          "message",
          (event) => {
            const data = apply(getMessageData, event, []);
            if (typeof data === "object" && data?.type === "measure") {
              sendHeight();
            } else if (
              typeof data === "object" &&
              data?.type === "widget-state-result"
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== "number") {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost("widget-state-write", { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener("change", syncTheme);
  globalThis.addEventListener("click", (event) => {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest("a[href]");
    const href = link?.getAttribute("href");
    if (href == null) {
      return;
    }
    if (href.startsWith("#")) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost("scroll-to", {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
</script>
<div id="courts-root">
  <style>
    :root {
      --ns-lime: light-dark(#d4f04a, #cfe94f);
      --ns-lime-deep: light-dark(#b4d92c, #bcdc46);
      --ns-coral: light-dark(#ff7a59, #ff9276);
      --ns-sky: light-dark(#3fb0ff, #6cc4ff);
      --ns-ink: light-dark(#1e2a15, #eef5e4);
      --ns-muted: light-dark(#5d6d52, #a9b8a0);
      --ns-panel: light-dark(rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.06));
      --ns-card: light-dark(#ffffff, rgba(255, 255, 255, 0.055));
      --ns-line: light-dark(rgba(30, 42, 21, 0.14), rgba(255, 255, 255, 0.16));
      --ns-shadow: 0 12px 34px light-dark(rgba(80, 110, 40, 0.16), rgba(0, 0, 0, 0.55));
      --ns-round: 20px;
      --ns-font: "Yuanti SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    }

    /* 页面底色只在独立网页里生效，嵌在对话里时保持原有样式 */
    html[data-visualize-standalone] body {
      background:
        radial-gradient(1100px 520px at 8% -8%, light-dark(#f1ffd6, #1c2413), transparent 70%),
        radial-gradient(900px 480px at 100% 2%, light-dark(#ffe9ec, #241a1a), transparent 70%),
        light-dark(#f9fcf2, #10130d);
      background-attachment: fixed;
    }

    #courts-root {
      box-sizing: border-box;
      font-family: var(--ns-font);
      color: var(--ns-ink);
      max-width: 1180px;
      margin: 0 auto;
    }

    html[data-visualize-standalone] #courts-root {
      background: var(--ns-panel);
      border-radius: var(--ns-round);
      padding: 16px 18px 22px;
      box-shadow: var(--ns-shadow);
      backdrop-filter: blur(8px);
    }

    html[data-visualize-standalone] #courts-root::before {
      content: "";
      display: block;
      height: 6px;
      margin-bottom: 14px;
      border-radius: 999px;
      background: repeating-linear-gradient(90deg, var(--ns-lime) 0 26px, transparent 26px 42px);
    }

    .ns-hero {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .ns-hero > div {
      min-width: 0;
      flex: 1 1 auto;
    }
    .ns-ball {
      font-size: 34px;
      line-height: 1;
      animation: ns-bounce 1.4s cubic-bezier(0.3, 1.6, 0.5, 1) 1 both;
    }
    @keyframes ns-bounce {
      0% {
        transform: translateY(-26px) scale(0.7);
      }
      60% {
        transform: translateY(0) scale(1.06);
      }
      100% {
        transform: translateY(0) scale(1);
      }
    }
    .ns-hero h3 {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .ns-sub {
      margin: 3px 0 0;
      font-size: 13px;
      color: var(--ns-muted);

    {"id": 173, "name": "深铁文体公园", "area": "南山其他", "kind": "室外", "types": ["室外场", "硬地场"], "open": "08:00", "close": "18:00", "wdDay": 160, "wdNight": null, "weekend": 160, "free": false, "indoor": false, "early": true, "night": false, "book": "微信订场", "contact": "公众号 深铁物业", "link": "", "lat": 22.565069, "lon": 113.993652, "addr": "南山区南坪快速路NOCC大厦北侧约250米"},
    {"id": 174, "name": "深云文体公园-室内网球场", "area": "西丽·桃源", "kind": "室内", "types": ["室内场", "硬地场"], "open": "08:00", "close": "23:00", "wdDay": 320, "wdNight": null, "weekend": 320, "free": false, "indoor": true, "early": true, "night": false, "book": "微信订场", "contact": "公众号 深铁物业", "link": "", "lat": 22.563370, "lon": 113.994911, "addr": "南山区深云文体公园羽毛球馆一楼"}
  ];

  const ORIGINS = [
    {"name": "南山站", "lat": 22.524040, "lon": 113.923671, "keys": ["南山站", "南山地铁", "南山大道", "桂庙", "向南", "南山街道"]},
    {"name": "南头古城", "lat": 22.537306, "lon": 113.924290, "keys": ["南头", "南头古城", "中山公园", "麒麟", "同乐"]},
    {"name": "蛇口·海上世界", "lat": 22.481784, "lon": 113.917626, "keys": ["蛇口", "海上世界", "水湾", "南海意库", "花园城", "四海"]},
    {"name": "后海站", "lat": 22.517572, "lon": 113.945310, "keys": ["后海", "海德", "海岸城", "君尚"]},
    {"name": "科苑站", "lat": 22.526058, "lon": 113.945906, "keys": ["科苑", "科技园", "科兴", "高新园", "高新南", "粤海", "深大", "麻岭"]},
    {"name": "华侨城", "lat": 22.533521, "lon": 113.985435, "keys": ["华侨城", "白石洲", "世界之窗", "沙河", "香山"]},
    {"name": "西丽站", "lat": 22.564929, "lon": 113.945224, "keys": ["西丽", "桃源", "大学城", "留仙洞", "深云", "茶光"]},
    {"name": "深圳湾口岸", "lat": 22.503020, "lon": 113.950231, "keys": ["深圳湾", "深湾", "春茧", "口岸", "东角头"]}
  ];

  const PRICE_KEYS = ["wdDay", "wdNight", "weekend"];
  const DEFAULT_FLAGS = {
    "163": { shade: true, cover: false },
    "168": { shade: false, cover: true },
    "223": { shade: true, cover: false },
    "256": { shade: false, cover: true },
    "329": { shade: true, cover: false },
    "165+166": { shade: false, cover: true }
  };
  const root = document.getElementById("courts-root");
  if (!root) return;

  const body = root.querySelector("#courts-body");
  const listEl = root.querySelector("#courts-list");
  const statusEl = root.querySelector("#courts-status");
  const originEl = root.querySelector("#courts-origin");
  const sortEl = root.querySelector("#courts-sort");
  const shareBar = root.querySelector("#courts-share-bar");
  const pickedEl = root.querySelector("#courts-picked");
  const shareEl = root.querySelector("#courts-share");
  const copyEl = root.querySelector("#courts-copy");
  const clearEl = root.querySelector("#courts-clear");
  const copyStatusEl = root.querySelector("#courts-copy-status");
  const sceneButtons = Array.from(root.querySelectorAll("[data-scene]"));

  const saved = (window.openai && window.openai.widgetState) || {};
  let scene = typeof saved.scene === "string" ? saved.scene : "all";
  let sortKey = typeof saved.sort === "string" ? saved.sort : "dist";
  let originName = typeof saved.origin === "string" ? saved.origin : "南山站";
  let originNote = "";
  const selected = new Set();
  const flags = {};
  let visibleRows = [];

  function loadFlags(source) {
    if (!source || typeof source !== "object") return;
    for (const key of Object.keys(source)) {
      const value = source[key];
      if (value && typeof value === "object") {
        flags[key] = { shade: Boolean(value.shade), cover: Boolean(value.cover) };
      }
    }
  }

  function compactFlags() {
    const out = {};
    for (const key of Object.keys(flags)) {
      const value = flags[key];
      out[key] = { shade: value.shade, cover: value.cover };
    }
    return out;
  }

  loadFlags(DEFAULT_FLAGS);
  loadFlags(saved.flags);

  function rowFlags(row) {
    const key = String(row.id);
    if (!flags[key]) flags[key] = { shade: false, cover: false };
    return flags[key];
  }

  function isRoofed(row) {
    if (row.indoor || row.kind === "学练馆") return true;
    const flag = rowFlags(row);
    return flag.shade || flag.cover;
  }

  const SCENES = {
    all: function () { return true; },
    early: function (row) { return row.early; },
    night: function (row) { return row.close >= "22:00"; },
    indoor: function (row) { return row.indoor || row.kind === "学练馆"; },
    covered: function (row) { return isRoofed(row); },
    free: function (row) { return row.free; }
  };

  function findOrigin(name) {
    for (const item of ORIGINS) {
      if (item.name === name) return item;
    }
    return ORIGINS[0];
  }

  function resolveOrigin(text) {
    const value = (text || "").trim();
    if (!value) return { name: "南山站", note: "" };
    for (const item of ORIGINS) {
      if (item.name === value) return { name: item.name, note: "" };
    }
    for (const item of ORIGINS) {
      for (const key of item.keys) {
        if (value.indexOf(key) !== -1) {
          return { name: item.name, note: "按「" + key + "」识别" };
        }
      }
    }
    return { name: originName, note: "没认出「" + value + "」，先按 " + originName + " 算" };
  }

  function distanceKm(origin, row) {
    const radius = 6371;
    const toRad = Math.PI / 180;
    const dLat = (row.lat - origin.lat) * toRad;
    const dLon = (row.lon - origin.lon) * toRad;
    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(origin.lat * toRad) * Math.cos(row.lat * toRad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return Math.round(2 * radius * Math.asin(Math.sqrt(a)) * 10) / 10;
  }

  function priceCell(value, cheapest) {
    const td = document.createElement("td");
    td.className = "text-nowrap tabular-nums ns-price";
    if (value === null || value === undefined) {
      td.textContent = "—";
      return td;
    }
    if (value === 0) {
      td.textContent = "免费";
      return td;
    }
    const amount = document.createElement("span");
    amount.textContent = String(value);
    const unit = document.createElement("span");
    unit.className = "text-muted text-small";
    unit.textContent = " 元";
    td.append(amount, unit);
    if (cheapest) {
      const badge = document.createElement("span");
      badge.className = "viz-badge";
      badge.textContent = "最低";
      td.append(document.createTextNode(" "), badge);
    }
    return td;
  }

  function makeMapLink(row) {
    const link = document.createElement("a");
    link.className = "text-small";
    link.href =
      "https://uri.amap.com/marker?position=" +
      row.lon +
      "," +
      row.lat +
      "&name=" +
      encodeURIComponent(row.name) +
      "&coordinate=gaode&callnative=1";
    link.target = "_blank";
    link.rel = "noreferrer";
    link.textContent = "地图";
    return link;
  }

  function navCell(row, origin) {
    const td = document.createElement("td");
    td.className = "text-nowrap tabular-nums";
    const distance = document.createElement("div");
    distance.textContent = distanceKm(origin, row).toFixed(1) + " km";
    td.append(distance, makeMapLink(row));
    return td;
  }

  function priceText(value) {
    if (value === null || value === undefined) return "—";
    if (value === 0) return "免费";
    return value + "元";
  }

  function makePicker(row) {
    const pick = document.createElement("input");
    pick.type = "checkbox";
    pick.className = "form-check-input";
    pick.checked = selected.has(String(row.id));
    pick.setAttribute("aria-label", "选择 " + row.name);
    pick.addEventListener("change", function () {
      if (pick.checked) selected.add(String(row.id));
      else selected.delete(String(row.id));
      updateShare();
    });
    return pick;
  }

  function makeKindBlock(row) {
    const wrap = document.createElement("div");
    const kindLine = document.createElement("div");
    kindLine.className = "text-nowrap";
    kindLine.append(document.createTextNode(row.kind));
    if (row.free) {
      const badge = document.createElement("span");
      badge.className = "viz-badge";
      badge.textContent = "免费";
      kindLine.append(document.createTextNode(" "), badge);
    }
    if (row.night) {
      const badge = document.createElement("span");
      badge.className = "viz-badge";
      badge.textContent = "通宵";
      kindLine.append(document.createTextNode(" "), badge);
    }
    wrap.append(kindLine);

    if (row.indoor || row.kind === "学练馆") {
      const note = document.createElement("div");
      note.className = "text-small text-muted";
      note.textContent = "不怕晒 · 不淋雨";
      wrap.append(note);
      return wrap;
    }

    const chips = document.createElement("div");
    chips.className = "text-nowrap";
    const options = [
      ["shade", "🌤 遮阴", "白天有遮挡，不晒"],
      ["cover", "☂ 风雨场", "有顶棚，能挡风遮雨"]
    ];
    for (const option of options) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "btn text-small";
      chip.textContent = option[1];
      chip.setAttribute("data-tooltip", option[2]);
      chip.setAttribute("aria-pressed", String(rowFlags(row)[option[0]]));
      chip.addEventListener("click", function () {
        const flag = rowFlags(row);
        flag[option[0]] = !flag[option[0]];
        render();
        save();
      });
      chips.append(chip, document.createTextNode(" "));
    }
    wrap.append(chips);
    return wrap;
  }

  function makeBookBlock(row) {
    const wrap = document.createElement("div");
    const main = document.createElement("div");
    main.textContent = row.book.replace(/订场$/, "");
    wrap.append(main);

    const contact = document.createElement("div");
    contact.className = "text-small text-muted";
    if (/^[0-9-]{6,}$/.test(row.contact)) {
      const tel = document.createElement("a");
      tel.href = "tel:" + row.contact;
      tel.textContent = row.contact;
      contact.append(tel);
    } else {
      contact.textContent = row.contact;
    }
    wrap.append(contact);

    if (row.link) {
      const code = document.createElement("code");
      code.className = "text-small";
      code.textContent = row.link;
      wrap.append(document.createElement("div"), code);
    }
    return wrap;
  }

  function makeListItem(row, origin) {
    const item = document.createElement("div");
    item.className = "ns-item";

    const label = document.createElement("label");
    label.className = "form-check";
    label.append(makePicker(row), document.createTextNode(" " + row.name));
    item.append(label);

    const meta = document.createElement("div");
    meta.className = "text-small text-muted";
    meta.textContent =
      row.area +
      " ｜ 距" +
      originName +
      " " +
      distanceKm(origin, row).toFixed(1) +
      "km ｜ " +
      row.open +
      "–" +
      row.close +
      " ｜ ";
    meta.append(makeMapLink(row));
    item.append(meta);

    item.append(makeKindBlock(row));

    const price = document.createElement("div");
    price.className = "text-small tabular-nums";
    const priceParts = [];
    if (row.wdDay !== null && row.wdDay !== undefined) priceParts.push("平日日场 " + priceText(row.wdDay));
    if (row.wdNight !== null && row.wdNight !== undefined) priceParts.push("晚场 " + priceText(row.wdNight));
    if (row.weekend !== null && row.weekend !== undefined) priceParts.push("周末 " + priceText(row.weekend));
    price.textContent = priceParts.length ? priceParts.join(" ｜ ") : "价格以场馆公示为准";
    item.append(price);

    item.append(makeBookBlock(row));
    return item;
  }

  function shareText(rows, origin) {
    const lines = ["南山·蛇口网球场（起点：" + originName + "）", ""];
    rows.forEach(function (row, index) {
      const prices = [];
      if (row.wdDay !== null && row.wdDay !== undefined) prices.push("平日日场 " + priceText(row.wdDay));
      if (row.wdNight !== null && row.wdNight !== undefined) prices.push("晚场 " + priceText(row.wdNight));
      if (row.weekend !== null && row.weekend !== undefined) prices.push("周末 " + priceText(row.weekend));
      const attrs = [];
      if (row.indoor) attrs.push("室内，不怕晒不淋雨");
      if (row.kind === "学练馆" && !row.indoor) attrs.push("学练馆，室内练习场");
      const flag = rowFlags(row);
      if (flag.shade) attrs.push("有遮阴");
      if (flag.cover) attrs.push("风雨场，有顶棚");
      lines.push(
        index + 1 + ". " + row.name + " ｜ 距" + originName + " " + distanceKm(origin, row).toFixed(1) + "km"
      );
      lines.push(
        "   " +
          row.kind +
          (attrs.length ? "（" + attrs.join("，") + "）" : "") +
          " ｜ " +
          row.open +
          "–" +
          row.close +
          " ｜ " +
          row.addr
      );
      lines.push("   " + (prices.length ? prices.join(" ｜ ") : "价格以场馆公示为准"));
      lines.push("   订场：" + row.book.replace(/订场$/, "") + " " + row.contact);
      if (row.link) lines.push("   小程序直达：" + row.link);
    });
    lines.push("");
    lines.push("空场和优惠以场馆小程序为准，定好时间提前一天告诉我。");
    return lines.join("\n");
  }

  function updateShare() {
    const picked = visibleRows.filter(function (row) {
      return selected.has(String(row.id));
    });
    pickedEl.textContent = "🧺 已选 " + picked.length + " 个场地";
    const hasPicked = picked.length > 0;
    const display = hasPicked ? "" : "none";
    shareBar.hidden = !hasPicked;
    shareEl.hidden = !hasPicked;
    shareBar.style.display = display;
    shareEl.style.display = display;
    shareEl.value = hasPicked ? shareText(picked, findOrigin(originName)) : "";
    copyStatusEl.textContent = "";
  }

  function render() {
    const origin = findOrigin(originName);
    const rows = COURTS.filter(SCENES[scene] || SCENES.all).sort(function (a, b) {
      if (sortKey === "name") return a.name.localeCompare(b.name, "zh-Hans-CN");
      if (sortKey === "dist") return distanceKm(origin, a) - distanceKm(origin, b);
      const left = a[sortKey];
      const right = b[sortKey];
      const lv = left === null || left === undefined || left === 0 ? Number.MAX_SAFE_INTEGER : left;
      const rv = right === null || right === undefined || right === 0 ? Number.MAX_SAFE_INTEGER : right;
      return lv - rv;
    });

    let cheapest = null;
    if (PRICE_KEYS.indexOf(sortKey) !== -1) {
      const values = rows
        .map(function (row) { return row[sortKey]; })
        .filter(function (value) { return value !== null && value !== undefined && value !== 0; });
      if (values.length) cheapest = Math.min.apply(null, values);
    }

    visibleRows = rows;
    body.textContent = "";
    listEl.textContent = "";
    if (!rows.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 9;
      td.className = "text-muted";
      td.textContent = "🎾 这个条件下暂时没有合适的场地";
      tr.append(td);
      body.append(tr);

      const empty = document.createElement("div");
      empty.className = "text-muted";
      empty.textContent = "🎾 这个条件下暂时没有合适的场地";
      listEl.append(empty);
    }

    for (const row of rows) {
      const tr = document.createElement("tr");

      const pickTd = document.createElement("td");
      pickTd.append(makePicker(row));
      tr.append(pickTd);

      const nameTd = document.createElement("td");
      const nameEl = document.createElement("span");
      nameEl.textContent = row.name;
      nameEl.setAttribute("data-tooltip", row.addr);
      const meta = document.createElement("div");
      meta.className = "text-small text-muted";
      meta.textContent = row.area;
      nameTd.append(nameEl, meta);
      tr.append(nameTd);

      tr.append(navCell(row, origin));

      const kindTd = document.createElement("td");
      kindTd.append(makeKindBlock(row));
      tr.append(kindTd);

      const hours = document.createElement("td");
      hours.className = "text-nowrap tabular-nums";
      hours.textContent = row.open + "–" + row.close;
      tr.append(hours);

      for (const key of PRICE_KEYS) {
        tr.append(priceCell(row[key], cheapest !== null && row[key] === cheapest));
      }

      const bookTd = document.createElement("td");
      bookTd.append(makeBookBlock(row));
      tr.append(bookTd);
      body.append(tr);

      if (listEl.childNodes.length) listEl.append(document.createElement("hr"));
      listEl.append(makeListItem(row, origin));
    }

    statusEl.textContent =
      "起点：" + originName + (originNote ? "（" + originNote + "）" : "") + " · 显示 " + rows.length + " 个场地";
    for (const button of sceneButtons) {
      button.setAttribute("aria-pressed", String(button.dataset.scene === scene));
    }
    sortEl.value = sortKey;
    updateShare();
  }

  function save() {
    if (!window.openai || !window.openai.setWidgetState) return;
    const snapshot = { origin: originName, scene: scene, sort: sortKey, flags: compactFlags() };
    window.openai
      .setWidgetState({
        modelContent: snapshot,
        privateContent: snapshot
      })
      .catch(function () {});
  }

  for (const button of sceneButtons) {
    button.addEventListener("click", function () {
      scene = button.dataset.scene;
      render();
      save();
    });
  }

  sortEl.addEventListener("change", function () {
    sortKey = sortEl.value;
    render();
    save();
  });

  originEl.addEventListener("input", function () {
    const resolved = resolveOrigin(originEl.value);
    originName = resolved.name;
    originNote = resolved.note;
    render();
  });

  originEl.addEventListener("change", save);

  function fallbackCopy() {
    shareEl.focus();
    shareEl.select();
    let ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (error) {
      ok = false;
    }
    return ok;
  }

  copyEl.addEventListener("click", function () {
    const text = shareEl.value;
    if (!text) return;
    const done = function (ok) {
      copyStatusEl.textContent = ok ? "已复制，直接粘贴发出去" : "没能自动复制，长按上面文字手动复制";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () {
          done(true);
        },
        function () {
          done(fallbackCopy());
        }
      );
    } else {
      done(fallbackCopy());
    }
  });

  clearEl.addEventListener("click", function () {
    selected.clear();
    render();
  });

  window.addEventListener("openai:set_globals", function (event) {
    const state = event.detail && event.detail.globals && event.detail.globals.widgetState;
    if (!state) return;
    if (typeof state.origin === "string") {
      originName = state.origin;
      originEl.value = state.origin;
    }
    if (typeof state.scene === "string" && SCENES[state.scene]) scene = state.scene;
    if (typeof state.sort === "string") sortKey = state.sort;
    loadFlags(state.flags);
    render();
  });

  originEl.value = originName;
  render();
})();
</script>

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");

  };

      (trigger.getAttribute("aria-describedby") ?? "")

    );

        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;

      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });

  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }

      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }

    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {

        closeTooltip(false);
      }

  };

    if (pinnedByTouch) {
      return;
    }

    }

      closeTooltip();
    }
  };

    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }

    if (event.key === "Escape") {
      closeTooltip();
    }
  };

    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };

  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");
      const status = document.createElement("span");
      status.className = "sr-only";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-atomic", "true");
      previous.setAttribute(
        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) => {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            "aria-current",
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
